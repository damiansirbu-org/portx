name: PORTX Package Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  PACKAGE_PREFIX: portx-packages

jobs:
  build-packages:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up environment
      run: |
        echo "RELEASE_TAG=${{ github.event.inputs.release_tag || github.ref_name }}" >> $env:GITHUB_ENV
        echo "RELEASE_DATE=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV
        
    - name: Create release directory
      run: |
        New-Item -ItemType Directory -Force -Path "release"
        
    - name: Package individual tools
      run: |
        # Core packages to release
        $packages = @(
            @{ name = "kubectl"; path = "packages/k8" },
            @{ name = "terraform"; path = "packages/terraform" },
            @{ name = "helm"; path = "packages/helm" },
            @{ name = "docker-compose"; path = "packages/docker-compose" },
            @{ name = "lazygit"; path = "packages/lazygit" },
            @{ name = "lazydocker"; path = "packages/lazydocker" },
            @{ name = "k9s"; path = "packages/k9s" },
            @{ name = "rclone"; path = "packages/rclone" },
            @{ name = "ripgrep"; path = "packages/ripgrep" },
            @{ name = "fd"; path = "packages/fd" },
            @{ name = "bat"; path = "packages/bat" },
            @{ name = "fzf"; path = "packages/fzf" },
            @{ name = "micro"; path = "packages/micro" },
            @{ name = "helix"; path = "packages/helix" },
            @{ name = "glow"; path = "packages/glow" },
            @{ name = "age"; path = "packages/age" },
            @{ name = "jq"; path = "packages/jq" },
            @{ name = "yq"; path = "packages/yq" },
            @{ name = "7zip"; path = "packages/7zip" },
            @{ name = "skopeo"; path = "packages/skopeo" }
        )
        
        foreach ($pkg in $packages) {
            $packagePath = $pkg.path
            $packageName = $pkg.name
            
            if (Test-Path $packagePath) {
                Write-Host "Packaging $packageName from $packagePath"
                
                # Create package-specific directory
                $tempDir = "temp-$packageName"
                New-Item -ItemType Directory -Force -Path $tempDir
                
                # Copy package contents
                Copy-Item -Path "$packagePath/*" -Destination $tempDir -Recurse -Force
                
                # Create package manifest if not exists
                $manifestPath = "$tempDir/package-manual.md"
                if (-not (Test-Path $manifestPath)) {
                    @"
# $packageName

**Package**: $packageName  
**Version**: $env:RELEASE_TAG  
**Release Date**: $env:RELEASE_DATE  
**Architecture**: windows-amd64

## Description

Professional tool from the PORTX ecosystem.

## Installation

Using PORTX package manager:
``````
portx-pkg install $packageName
``````

## Usage

``````
$packageName --help
``````

For more information, visit the PORTX documentation.
"@ | Out-File -FilePath $manifestPath -Encoding UTF8
                }
                
                # Create zip archive
                $zipName = "$packageName-$env:RELEASE_TAG-windows-amd64.zip"
                Compress-Archive -Path "$tempDir/*" -DestinationPath "release/$zipName" -Force
                
                # Cleanup
                Remove-Item -Path $tempDir -Recurse -Force
                
                Write-Host "Created: release/$zipName"
            } else {
                Write-Warning "Package path not found: $packagePath"
            }
        }
        
    - name: Create package index
      run: |
        # Create package index file
        $indexContent = @"
# PORTX Package Repository Index

**Release**: $env:RELEASE_TAG  
**Date**: $env:RELEASE_DATE  
**Repository**: https://github.com/${{ github.repository }}

## Available Packages

"@
        
        # List all created packages
        Get-ChildItem -Path "release" -Filter "*.zip" | ForEach-Object {
            $size = [math]::Round($_.Length / 1MB, 2)
            $indexContent += "- **$($_.BaseName)** - $size MB`n"
        }
        
        $indexContent += @"

## Installation

1. Add this repository to PORTX:
``````
portx-repo add-repo https://api.github.com/repos/${{ github.repository }}/releases
``````

2. Update package index:
``````
portx-repo update
``````

3. Install packages:
``````
portx-pkg install kubectl
portx-pkg install terraform
portx-pkg install helm
``````

## Package Manager

Use the PORTX package manager for easy installation and management:

``````
# Search packages
portx-pkg search docker

# Install packages  
portx-pkg install docker-compose

# List installed
portx-pkg list

# Get package info
portx-pkg info kubectl
``````
"@
        
        $indexContent | Out-File -FilePath "release/README.md" -Encoding UTF8
        
    - name: Calculate checksums
      run: |
        # Create checksums file
        Set-Location release
        $checksums = @()
        
        Get-ChildItem -Filter "*.zip" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.Name -Algorithm SHA256).Hash.ToLower()
            $checksums += "$hash  $($_.Name)"
        }
        
        $checksums | Out-File -FilePath "SHA256SUMS" -Encoding ASCII
        
        Write-Host "Created checksums:"
        Get-Content "SHA256SUMS"
        
    - name: List release artifacts
      run: |
        Write-Host "Release artifacts created:"
        Get-ChildItem -Path "release" | ForEach-Object {
            $size = if ($_.PSIsContainer) { "DIR" } else { "$([math]::Round($_.Length / 1KB, 1)) KB" }
            Write-Host "  $($_.Name) - $size"
        }
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: PORTX Packages ${{ env.RELEASE_TAG }}
        body: |
          ## PORTX Package Release ${{ env.RELEASE_TAG }}
          
          **Release Date**: ${{ env.RELEASE_DATE }}
          **Architecture**: Windows x64
          
          ### 📦 Package Installation
          
          1. **Add repository to PORTX:**
          ```bash
          portx-repo add-repo https://api.github.com/repos/${{ github.repository }}/releases
          ```
          
          2. **Update package index:**
          ```bash
          portx-repo update
          ```
          
          3. **Install packages:**
          ```bash
          portx-pkg install kubectl
          portx-pkg install terraform  
          portx-pkg install helm
          ```
          
          ### 🔧 Available Packages
          
          - **kubectl** - Kubernetes command-line tool
          - **terraform** - Infrastructure as Code tool
          - **helm** - Kubernetes package manager
          - **docker-compose** - Multi-container Docker applications
          - **lazygit** - Simple terminal UI for git commands
          - **lazydocker** - Simple terminal UI for docker commands
          - **k9s** - Kubernetes CLI management tool
          - **rclone** - Cloud storage sync tool
          - **ripgrep** - Fast text search tool
          - **fd** - Fast file finder
          - **bat** - Cat clone with syntax highlighting
          - **fzf** - Fuzzy finder
          - **micro** - Terminal text editor
          - **helix** - Modern text editor
          - **jq** - JSON processor
          - **yq** - YAML processor
          - **7zip** - File archiver
          
          ### 🛡️ Security
          
          All packages include SHA256 checksums for verification. See `SHA256SUMS` file.
          
          ### 📖 Documentation
          
          - [Package Manager Guide](https://github.com/${{ github.repository }}/blob/main/doc-portx/package-manager.md)
          - [Remote Repository Setup](https://github.com/${{ github.repository }}/blob/main/doc-portx/package-manager-remote.md)
          - [PORTX Architecture](https://github.com/${{ github.repository }}/blob/main/doc-portx/architecture.md)
          
        files: |
          release/*.zip
          release/README.md
          release/SHA256SUMS
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Test installation workflow
  test-installation:
    needs: build-packages
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'  # Only run on manual trigger
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up PORTX environment
      run: |
        # Copy PORTX tools to test location
        $testPath = "C:\test-portx"
        New-Item -ItemType Directory -Force -Path $testPath
        
        # Copy package manager
        Copy-Item -Path "bin\portx-pkg" -Destination "$testPath\portx-pkg.sh" -Force
        Copy-Item -Path "bin\portx-repo" -Destination "$testPath\portx-repo.sh" -Force
        
    - name: Test package installation
      run: |
        # Test repository addition and package installation
        $env:PORTX_ROOT = "C:\test-portx"
        
        # Test repository addition
        Write-Host "Testing repository addition..."
        bash C:\test-portx\portx-repo.sh add-repo "https://api.github.com/repos/${{ github.repository }}/releases"
        
        # Test package index update
        Write-Host "Testing package index update..."
        bash C:\test-portx\portx-repo.sh update
        
        # Test package search
        Write-Host "Testing package search..."
        bash C:\test-portx\portx-repo.sh search kubectl
        
        Write-Host "Package installation test completed successfully!"