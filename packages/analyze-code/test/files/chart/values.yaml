# Default values for test-analyzer-app Helm chart
# Cross-references: Chart.yaml, config.yaml, TestService.java, UserService.cs, tests.js

# Global configuration that applies to all sub-charts
global:
  # Image registry configuration
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  
  # PostgreSQL configuration (shared with postgresql sub-chart)
  postgresql:
    auth:
      postgresPassword: "test-analyzer-postgres"
      username: "testuser"
      password: "testpass"
      database: "testdb"
  
  # Redis configuration (shared with redis sub-chart)
  redis:
    auth:
      enabled: true
      password: "redis-password"

# Application image configuration
image:
  # Multi-service image configuration for different languages
  java:
    registry: docker.io
    repository: example/test-analyzer-java
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  
  python:
    registry: docker.io
    repository: example/test-analyzer-python
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  
  node:
    registry: docker.io
    repository: example/test-analyzer-node
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  
  dotnet:
    registry: docker.io
    repository: example/test-analyzer-dotnet
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  
  scripts:
    registry: docker.io
    repository: example/test-analyzer-scripts
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent

# Image pull secrets
imagePullSecrets: []
# - name: myregistrykey

# Service account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
  labels: {}

# Pod security context
podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Multi-service deployment configuration
services:
  # Java service (TestService.java)
  java:
    enabled: true
    replicaCount: 2
    
    image: java  # References global.image.java
    
    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080
      annotations: {}
    
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
    
    # Java-specific configuration
    jvm:
      options:
        - "-Xmx256m"
        - "-XX:+UseG1GC"
        - "-XX:+UseStringDeduplication"
      
    env:
      - name: SPRING_PROFILES_ACTIVE
        value: "production"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: database-secret
            key: url
  
  # Python service (json_helper.py)
  python:
    enabled: true
    replicaCount: 2
    
    image: python  # References global.image.python
    
    service:
      type: ClusterIP
      port: 8081
      targetPort: 8000
      annotations: {}
    
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
    
    env:
      - name: PYTHONPATH
        value: "/app"
      - name: PYTHON_ENV
        value: "production"
      - name: CONFIG_FILE
        value: "/app/config/config.yaml"
  
  # Node.js service (tests.js)
  node:
    enabled: true
    replicaCount: 2
    
    image: node  # References global.image.node
    
    service:
      type: ClusterIP
      port: 8082
      targetPort: 3000
      annotations: {}
    
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
    
    env:
      - name: NODE_ENV
        value: "production"
      - name: PORT
        value: "3000"
  
  # .NET service (UserService.cs)
  dotnet:
    enabled: true
    replicaCount: 2
    
    image: dotnet  # References global.image.dotnet
    
    service:
      type: ClusterIP
      port: 8083
      targetPort: 5000
      annotations: {}
    
    resources:
      limits:
        cpu: 400m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    
    env:
      - name: ASPNETCORE_ENVIRONMENT
        value: "Production"
      - name: ASPNETCORE_URLS
        value: "http://+:5000"
  
  # Scripts service (execute_tests.sh and related)
  scripts:
    enabled: true
    replicaCount: 1
    
    image: scripts  # References global.image.scripts
    
    service:
      type: ClusterIP
      port: 8084
      targetPort: 8080
      annotations: {}
    
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 32Mi

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: test-analyzer.local
      paths:
        - path: /java
          pathType: Prefix
          service:
            name: java
            port: 8080
        - path: /python
          pathType: Prefix
          service:
            name: python
            port: 8081
        - path: /node
          pathType: Prefix
          service:
            name: node
            port: 8082
        - path: /dotnet
          pathType: Prefix
          service:
            name: dotnet
            port: 8083
        - path: /scripts
          pathType: Prefix
          service:
            name: scripts
            port: 8084
  tls: []
  #  - secretName: test-analyzer-tls
  #    hosts:
  #      - test-analyzer.local

# ConfigMap for configuration files
configMap:
  enabled: true
  data:
    config.yaml: |
      database:
        url: "postgresql://postgres:5432/testdb"
        timeout: 30
        poolSize: 10
      api:
        timeout: 60
        retries: 3
        rateLimit: 100
      features:
        - logging
        - monitoring
        - admin_filter
        - age_filter
      logging:
        level: "info"
        format: "json"
      testing:
        parallel: true
        maxWorkers: 4
        timeout: 300
    
    package.json: |
      {
        "name": "test-analyzer-validation",
        "version": "1.0.0",
        "main": "tests.js",
        "dependencies": {
          "js-yaml": "^4.1.0",
          "lodash": "^4.17.21"
        }
      }

# Secret for sensitive configuration
secrets:
  enabled: true
  data:
    database:
      url: "postgresql://testuser:testpass@postgresql:5432/testdb"
    redis:
      url: "redis://:redis-password@redis:6379"
    jwt:
      secret: "jwt-super-secret-key-for-testing"
    api:
      key: "api-key-for-external-services"

# Persistent volumes for data storage
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""
  annotations: {}
  existingClaim: ""

# Node selector for pod placement
nodeSelector: {}

# Tolerations for pod scheduling
tolerations: []

# Affinity rules for pod placement
affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Network policies
networkPolicy:
  enabled: false
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080

# Service monitor for Prometheus
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

# PostgreSQL sub-chart configuration
postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    postgresPassword: "test-analyzer-postgres"
    username: "testuser"
    password: "testpass"
    database: "testdb"
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        memory: 256Mi
        cpu: 250m
      requests:
        memory: 128Mi
        cpu: 100m

# Redis sub-chart configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "redis-password"
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        memory: 256Mi
        cpu: 250m
      requests:
        memory: 128Mi
        cpu: 100m

# Monitoring configuration
monitoring:
  prometheus:
    enabled: false
    server:
      persistentVolume:
        size: 8Gi
    alertmanager:
      persistentVolume:
        size: 2Gi
  
  grafana:
    enabled: false
    admin:
      password: "admin"
    persistence:
      enabled: true
      size: 1Gi

# Init containers for setup tasks
initContainers:
  - name: wait-for-postgresql
    image: busybox:1.35
    command:
      - 'sh'
      - '-c'
      - |
        until nc -z postgresql 5432; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready!"
  
  - name: wait-for-redis
    image: busybox:1.35
    command:
      - 'sh'
      - '-c'
      - |
        until nc -z redis 6379; do
          echo "Waiting for Redis..."
          sleep 2
        done
        echo "Redis is ready!"

# Sidecar containers
sidecars: []
# - name: log-collector
#   image: fluent/fluent-bit:1.9
#   volumeMounts:
#   - name: varlog
#     mountPath: /var/log

# Extra volumes
extraVolumes: []
# - name: varlog
#   emptyDir: {}

# Extra volume mounts
extraVolumeMounts: []
# - name: varlog
#   mountPath: /var/log

# Pod annotations
podAnnotations:
  analyzer.example.com/version: "1.0.0"
  analyzer.example.com/languages: "java,python,javascript,csharp,bash"

# Pod labels
podLabels:
  app.kubernetes.io/component: analyzer
  app.kubernetes.io/part-of: test-framework

# Deployment annotations
deploymentAnnotations:
  deployment.kubernetes.io/revision: "1"

# Service annotations
serviceAnnotations: {}

# Health check configuration
healthcheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

# Testing configuration for chart validation
tests:
  enabled: true
  image:
    registry: docker.io
    repository: curlimages/curl
    tag: "8.1.2"
    pullPolicy: IfNotPresent
  
  # Test cases for chart validation
  testCases:
    - name: test-java-service
      command:
        - 'sh'
        - '-c'
        - 'curl -f http://{{ include "test-analyzer-app.fullname" . }}-java:8080/health || exit 1'
    
    - name: test-python-service
      command:
        - 'sh'
        - '-c'
        - 'curl -f http://{{ include "test-analyzer-app.fullname" . }}-python:8081/health || exit 1'
    
    - name: test-node-service
      command:
        - 'sh'
        - '-c'
        - 'curl -f http://{{ include "test-analyzer-app.fullname" . }}-node:8082/health || exit 1'
    
    - name: test-dotnet-service
      command:
        - 'sh'
        - '-c'
        - 'curl -f http://{{ include "test-analyzer-app.fullname" . }}-dotnet:8083/health || exit 1'