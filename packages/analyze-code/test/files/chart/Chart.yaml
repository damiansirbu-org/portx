# Helm chart metadata for test application
# Cross-references: config.yaml, values.yaml, UserService.cs, TestService.java

apiVersion: v2
name: test-analyzer-app
description: A Helm chart for multi-language test application with analyzer validation
type: application
version: 1.0.0
appVersion: "1.0.0"

# Chart metadata
home: https://github.com/example/test-analyzer-validation
sources:
  - https://github.com/example/test-analyzer-validation
  - https://github.com/example/test-analyzer-validation/helm-chart

# Keywords for chart discovery
keywords:
  - testing
  - analyzer
  - validation
  - multi-language
  - microservices
  - java
  - python
  - javascript
  - dotnet
  - bash

# Maintainer information
maintainers:
  - name: Test Framework Team
    email: test-framework@example.com
    url: https://github.com/example/test-framework

# Chart dependencies
dependencies:
  - name: postgresql
    version: "12.6.6"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    tags:
      - database
  - name: redis
    version: "17.11.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    tags:
      - cache
  - name: prometheus
    version: "23.1.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
    tags:
      - monitoring
  - name: grafana
    version: "6.57.4"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
    tags:
      - monitoring

# Chart annotations for additional metadata
annotations:
  # Category for Artifact Hub
  category: Testing
  
  # Licenses
  licenses: MIT
  
  # Links
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/example/test-analyzer-validation/tree/main/chart
    - name: Documentation
      url: https://github.com/example/test-analyzer-validation/blob/main/README.md
    - name: Support
      url: https://github.com/example/test-analyzer-validation/issues
  
  # Screenshots for UI
  artifacthub.io/screenshots: |
    - title: Application Dashboard
      url: https://example.com/screenshots/dashboard.png
    - title: Test Results View
      url: https://example.com/screenshots/results.png
  
  # Changes for this version
  artifacthub.io/changes: |
    - Added multi-language analyzer support
    - Implemented cross-reference validation
    - Enhanced dependency analysis
    - Added Helm chart testing framework
    - Improved integration with external services
  
  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/bitnami/postgresql
    - url: https://artifacthub.io/packages/helm/bitnami/redis
    - url: https://artifacthub.io/packages/helm/prometheus-community/prometheus
  
  # Container images used by this chart
  artifacthub.io/images: |
    - name: test-analyzer-java
      image: example/test-analyzer-java:1.0.0
    - name: test-analyzer-python
      image: example/test-analyzer-python:1.0.0
    - name: test-analyzer-node
      image: example/test-analyzer-node:1.0.0
    - name: test-analyzer-dotnet
      image: example/test-analyzer-dotnet:1.0.0
    - name: test-analyzer-scripts
      image: example/test-analyzer-scripts:1.0.0

# Supported Kubernetes versions
kubeVersion: ">=1.20.0-0"

# Chart deprecation (if applicable)
# deprecated: true

