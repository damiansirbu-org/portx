{{- if .Values.reliabilityManagement.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: oam-reliability-management-secret
  labels:
    app: reliability-management
type: Opaque
data:
  DB_USER: {{ .Values.reliabilityManagementDB.auth.username | b64enc }}
  DB_PASS: {{ .Values.reliabilityManagementDB.auth.password | b64enc }}
  MSGBROKER_USER: {{ .Values.rabbit.auth.username | b64enc }}
  MSGBROKER_PASS: {{ .Values.rabbit.auth.password | b64enc }}
  {{- range $secretName, $value := .Values.reliabilityManagement.envSecrets }}
  {{ $secretName }}: {{ $value | b64enc }}
  {{- end }}
{{- end -}}