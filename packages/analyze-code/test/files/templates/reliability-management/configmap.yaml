{{- if .Values.reliabilityManagement.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oam-reliability-management-configmap
  labels:
    app: reliability-management
data:
  LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"
  EUREKA_URI: {{ printf "http://%s/eureka" .Values.serviceRegistry.service.name | quote }}
  DB_HOST: {{ .Values.reliabilityManagementDB.fullnameOverride | quote }}
  DB_NAME: {{ .Values.reliabilityManagementDB.auth.database | quote }}
  DB_PORT: {{ .Values.reliabilityManagementDB.port | quote }}
  MSGBROKER_HOST: {{ .Values.rabbit.fullnameOverride | quote }}
  MSGBROKER_PORT: {{ .Values.rabbit.service.ports.amqp | quote }}
  {{- range $envName, $value := .Values.reliabilityManagement.env }}
  {{ $envName }}: {{ $value | quote }}
  {{- end }}
{{- end -}}