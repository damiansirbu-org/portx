{{- if .Values.reliabilityManagement.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.reliabilityManagement.service.name }}
spec:
  type: {{ .Values.reliabilityManagement.service.type }}
  ports:
    - port: {{ .Values.reliabilityManagement.service.port }}
      targetPort: {{ .Values.reliabilityManagement.service.targetport }}
      protocol: TCP
  selector:
    app: reliability-management
{{- end -}}