{{- if .Values.userService.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.userService.name }}
  labels:
    app: user-service
    type: microservice
spec:
  selector:
    matchLabels:
      app: user-service
  replicas: {{ .Values.userService.replicas | default 2 }}
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}"
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: user-service-config
              key: db_host
        - name: DB_PASSWORD  
          valueFrom:
            secretKeyRef:
              name: user-service-secret
              key: db_password
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
{{- end -}}