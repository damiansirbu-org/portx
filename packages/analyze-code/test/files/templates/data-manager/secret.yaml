{{- if .Values.dataManager.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: oam-data-manager-secret
  labels:
    app: data-manager
type: Opaque
data:
  DB_USER: {{ .Values.dataManagerDB.auth.username | b64enc }}
  DB_PASS: {{ .Values.dataManagerDB.auth.password | b64enc }}
  MSGBROKER_USER: {{ .Values.rabbit.auth.username | b64enc }}
  MSGBROKER_PASS: {{ .Values.rabbit.auth.password | b64enc }}
{{- range $secretName, $value := .Values.dataManager.envSecrets }}
  {{ $secretName }}: {{ $value | b64enc }}
{{- end }}
{{- end -}}
