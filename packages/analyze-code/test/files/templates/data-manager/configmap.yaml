{{- if .Values.dataManager.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oam-data-manager-configmap
  labels:
    app: data-manager
data:
  LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"
  EUREKA_URI: {{ printf "http://%s/eureka" .Values.serviceRegistry.service.name | quote }}
  DB_HOST: {{ .Values.dataManagerDB.fullnameOverride | quote }}
  DB_NAME: {{ .Values.dataManagerDB.auth.database | quote }}
  DB_PORT: {{ .Values.dataManagerDB.port  | quote }}
  MSGBROKER_HOST: {{ .Values.rabbit.fullnameOverride | quote }}
  MSGBROKER_PORT: {{ .Values.rabbit.service.ports.amqp | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ printf "%s:%v" .Values.kafka_kraft.fullnameOverride .Values.kafka_kraft.listeners.client.port | quote }}
  KAFKA_PRODUCER_ENABLED: {{ .Values.kafka_kraft.enabled | quote }}
  KAFKA_USERNAME: {{ index .Values.kafka_kraft.sasl.client.users 0 | quote }}
  KAFKA_PASSWORD: {{ index .Values.kafka_kraft.sasl.client.passwords 0 | quote }}
  JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1000m"
  MEMCACHED_HOST: {{ .Values.memCache.fullnameOverride | quote }}
  MEMCACHED_PORT: {{ .Values.memCache.service.ports.memcached | quote }}
  MEP_STREAMING_TYPE: "WEBSOCKET"
  {{- range $envName, $value := .Values.dataManager.env }}
  {{ $envName }}: {{ $value | quote }}
  {{- end }}
{{- end -}}
