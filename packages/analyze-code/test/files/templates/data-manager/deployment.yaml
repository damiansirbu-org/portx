{{- if .Values.dataManager.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.dataManager.deploymentName }}
  labels:
    app: data-manager
    type: oam-service
spec:
  selector:
    matchLabels:
      app: data-manager
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/data-manager/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/data-manager/secret.yaml") . | sha256sum }}
      labels:
        app: data-manager
        type: oam-service
    spec:
      automountServiceAccountToken: false
      {{- if eq .Values.tags.aws true }}
      imagePullSecrets:
        - name: {{ .Values.harbor.pullsecretname }}
      {{- end }}
      containers:
        - name: data-manager
          image: "{{ .Values.image.registry }}/{{ .Values.dataManager.image.repository }}:{{ .Values.dataManager.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dataManager.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: oam-data-manager-configmap
            - secretRef:
                name: oam-data-manager-secret
          ports:
            - name: http
              containerPort: {{ .Values.dataManager.port }}
          resources:
            {{- toYaml .Values.dataManager.resources | nindent 12 }}
          {{- with .Values.dataManager.probes }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      initContainers:
        - name: init-service-registry
          image: "{{ .Values.image.docker }}busybox:1.28"
          command: ['sh', '-c', "until nslookup service-registry.{{ .Release.Namespace }}.svc.cluster.local; do echo waiting for service-registry; sleep 2; done"]
        - name: init-database
          image: "{{ .Values.image.docker }}busybox:1.28"
          command: ['sh', '-c', "until nslookup {{ .Values.dataManagerDB.fullnameOverride }}.{{ .Release.Namespace }}.svc.cluster.local; do echo waiting for postgres; sleep 2; done"]
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
{{- end -}}
