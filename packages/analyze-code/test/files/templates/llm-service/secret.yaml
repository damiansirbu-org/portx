{{- if .Values.llmService.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: oam-llm-service-secret
  labels:
    app: llm-service
type: Opaque
data:
    DB_USER: {{ .Values.llmServiceDB.auth.username | b64enc }}
    DB_PASS: {{ .Values.llmServiceDB.auth.password | b64enc }}
    MSGBROKER_USER: {{ .Values.rabbit.auth.username | b64enc }}
    MSGBROKER_PASS: {{ .Values.rabbit.auth.password | b64enc }}
{{- range $secretName, $value := .Values.llmService.envSecrets }}
  {{ $secretName }}: {{ $value | b64enc }}
{{- end }}
{{- end -}}
