{{- if .Values.llmService.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.llmService.deploymentName }}
  labels:
    app: llm-service
    type: oam-service
spec:
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/llm-service/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/llm-service/secret.yaml") . | sha256sum }}
      labels:
        app: llm-service
        type: oam-service
    spec:
      automountServiceAccountToken: false
      {{- if eq .Values.tags.aws true }}
      imagePullSecrets:
        - name: {{ .Values.harbor.pullsecretname }}
      {{- end }}
      containers:
        - name: llm-service
          image: "{{ .Values.image.registry }}/{{ .Values.llmService.image.repository }}:{{ .Values.llmService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.llmService.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: oam-llm-service-configmap
            - secretRef:
                name: oam-llm-service-secret
          ports:
            - name: http
              containerPort: {{ .Values.llmService.port }}
          resources:
            {{- toYaml .Values.llmService.resources | nindent 12 }}
          {{- with .Values.llmService.probes }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      initContainers:
        - name: init-service-registry
          image: "{{ .Values.image.docker }}busybox:1.28"
          command: ['sh', '-c', "until nslookup service-registry.{{ .Release.Namespace }}.svc.cluster.local; do echo waiting for service-registry; sleep 2; done"]
        - name: init-database
          image: "{{ .Values.image.docker }}busybox:1.28"
          command: [ 'sh', '-c', "until nslookup {{ .Values.llmServiceDB.fullnameOverride }}.{{ .Release.Namespace }}.svc.cluster.local; do echo waiting for postgres; sleep 2; done" ]
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
{{- end -}}
