{{- if .Values.auth.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-reset-config
data:
  reset.sh: |
    #!/bin/bash

    /opt/keycloak/bin/kc.sh export  --realm OAM --dir {{ .Values.auth.resetjob.mount }} --users same_file

    echo "##### List directory before realm overwrite #####"

    ls -al {{ .Values.auth.resetjob.mount }}/

    echo "##### Display first 10 lines of old realm #####"

    head {{ .Values.auth.resetjob.mount }}/OAM-realm.json

    echo "##### Display last 10 lines of old realm #####"

    tail {{ .Values.auth.resetjob.mount }}/OAM-realm.json

    echo "##### Overwrite Realm file #####"

    cp -f /tmp/realm.json {{ .Values.auth.resetjob.mount }}/OAM-realm.json

    echo "##### List directory after realm overwrite #####"

    ls -al {{ .Values.auth.resetjob.mount }}/

    echo "##### Display first 10 lines of new realm #####"

    head {{ .Values.auth.resetjob.mount }}/OAM-realm.json

    echo "##### Display last 10 lines of new realm #####"

    tail {{ .Values.auth.resetjob.mount }}/OAM-realm.json

    /opt/keycloak/bin/kc.sh import  --dir {{ .Values.auth.resetjob.mount }}
{{- end -}}
