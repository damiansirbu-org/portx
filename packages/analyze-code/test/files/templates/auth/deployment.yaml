{{- if .Values.auth.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.auth.deploymentName }}
  labels:
    app: keycloak
    type: oam-service
spec:
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/auth/configmap.yaml") . | sha256sum }}{{ .Values.auth.reset | quote | sha256sum }}
        checksum/config: {{ .Values.auth.profileSetup | quote | sha256sum }}{{ printf "%s" .Values.auth.reset | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/auth/secret.yaml") . | sha256sum }}
      labels:
        app: auth
        type: oam-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: auth
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - start
            - --spi-login-protocol-openid-connect-legacy-logout-redirect-uri=true
            - --http-enabled=true
            - --features=preview
            - --hostname-strict=false
            - --http-relative-path=/auth
            - --import-realm
            - --spi-connections-jpa-legacy-migration-strategy=update
          envFrom:
            - configMapRef:
                name: oam-auth-configmap
            - secretRef:
                name: oam-auth-secret
          ports:
            - name: http
              containerPort: {{ .Values.auth.port }}
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /opt/keycloak/data/import/profile-setup.json
              name: oam-auth-config
              subPath: profile-setup.json
      initContainers:
        - name: init-database
          image: "{{ .Values.image.docker }}busybox:1.28"
          command: ['sh', '-c', "until nslookup {{ .Values.authDB.fullnameOverride }}.{{ .Release.Namespace }}.svc.cluster.local; do echo waiting for {{ .Values.authDB.fullnameOverride }}; sleep 2; done"]
      volumes:
        - name: oam-auth-config
          configMap:
            name: oam-auth-config
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
{{- end -}}
