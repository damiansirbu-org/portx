{{- if .Values.auth.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: oam-auth-secret
  labels:
    app: auth
type: Opaque
data:
  KC_DB_USERNAME: {{ .Values.authDB.auth.username | b64enc }}
  KC_DB_PASSWORD: {{ .Values.authDB.auth.password | b64enc }}
{{- range $secretName, $value := .Values.auth.envSecrets }}
  {{ $secretName }}: {{ $value | b64enc }}
{{- end }}
{{- end -}}
