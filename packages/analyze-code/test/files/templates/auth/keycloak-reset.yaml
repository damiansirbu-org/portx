{{- if and .Values.auth.enabled (eq .Values.auth.reset true)  }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-reset-{{ randAlphaNum 8 | lower }}
spec:
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/auth/configmap-reset.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if eq .Values.tags.aws true }}
      imagePullSecrets:
        - name: {{ .Values.harbor.pullsecretname }}
      {{- end }}
      volumes:
        - name: {{ .Values.auth.resetjob.claimname }}
          persistentVolumeClaim:
            claimName: {{ .Values.auth.resetjob.claimname }}
        - name: oam-auth-config
          configMap:
            name: oam-auth-config
        - name: keycloak-reset-config
          configMap:
            name: keycloak-reset-config
            defaultMode: 0777
      containers:
        - name: import-realm
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag | default .Chart.AppVersion }}"
          command:
            - /bin/bash
          args:
            - -c
            - /scripts/reset.sh
          envFrom:
            - configMapRef:
                name: oam-auth-configmap
            - secretRef:
                name: oam-auth-secret
          volumeMounts:
            - mountPath: {{ .Values.auth.resetjob.mount }}
              name: {{ .Values.auth.resetjob.claimname }}
            - mountPath: /tmp/realm.json
              name: oam-auth-config
              subPath: profile-setup.json
            - name: keycloak-reset-config
              mountPath: /scripts/reset.sh
              subPath: reset.sh
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 172800
{{- end }}
