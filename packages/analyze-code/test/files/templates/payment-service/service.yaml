{{- if .Values.paymentService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.paymentService.name }}
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - port: 9090
    targetPort: 9090
    name: http
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
{{- end -}}