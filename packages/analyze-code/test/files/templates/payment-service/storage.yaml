{{- if and (.Values.paymentService.enabled) (.Values.paymentService.persistence.enabled) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.paymentService.name }}-pvc
  labels:
    app: payment-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.paymentService.persistence.size | default "10Gi" }}
  {{- if .Values.paymentService.persistence.storageClass }}
  storageClassName: {{ .Values.paymentService.persistence.storageClass }}
  {{- end }}
{{- end -}}