# Fluentbit values
fluentbit:
  enabled: true
  image:
    repository: harbor.mosaic.siemens-energy.cloud/docker-cache/fluent/fluent-bit
    pullPolicy: IfNotPresent
  testFramework:
    image:
      repository: harbor.mosaic.siemens-energy.cloud/docker-cache/busybox
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nameOverride: "fluentbit"
  fullnameOverride: "fluentbit"
  extraVolumes:
    - name: fluentbitstate
      hostPath:
        path: /var/fluent-bit/state
  extraVolumeMounts:
    - name: fluentbitstate
      mountPath: /var/fluent-bit/state
  config:
    service: |
      [SERVICE]
          Daemon                    Off
          Grace                     30
          Flush                     5
          Log_Level                 info
          Parsers_File              parsers.conf
          HTTP_Server               true
          HTTP_Listen               0.0.0.0
          HTTP_Port                 2020
          storage.path              /var/fluent-bit/state/flb-storage/
          storage.sync              normal
          storage.checksum          off
          storage.backlog.mem_limit 5M
    ## https://docs.fluentbit.io/manual/pipeline/inputs
    inputs: |
      [INPUT]
          Name             tail
          Path             /var/log/containers/*.log
          Exclude_Path     /var/log/containers/fluentbit*, /var/log/containers/coredns*.log, /var/log/containers/opensearch*.log, /var/log/containers/oam-opensearch*.log, /var/log/containers/etcd*.log, /var/log/containers/traefik*.log, /var/log/containers/storage-provisioner*.log, /var/log/containers/kube*.log, /var/log/containers/calico*.log, /var/log/containers/grafana*.log, /var/log/containers/rabbitmq*.log, /var/log/containers/tigera*.log
          multiline.parser cri
          Parser           cri
          Tag kube.*
          Mem_Buf_Limit    50MB
          Skip_Long_Lines  On
          DB               /var/fluent-bit/state/flb_container.db
          Refresh_Interval 10
          Rotate_Wait      30
          storage.type     filesystem
    ## https://docs.fluentbit.io/manual/pipeline/filters
    filters: |
      [FILTER]
          Name                kubernetes
          Match               kube.*
          Kube_URL            https://kubernetes.default.svc:443
          tls.verify          Off
          Kube_Tag_Prefix     kube.var.log.containers.
          Merge_Log           On
          Merge_Log_Key       log_processed
          K8S-Logging.Parser  On
          K8S-Logging.Exclude Off
          Labels              Off
          Annotations         Off
          Use_Kubelet         Off
          Kubelet_Port        10250
          Buffer_Size         0
      [FILTER]
          Name            nest
          Match           kube.*
          Operation       lift
          Nested_under    kubernetes
          Add_prefix      kubernetes.
      [FILTER]
          Name            record_modifier
          Match           kube.*
          Remove_key      kubernetes.container_hash
          Remove_key      kubernetes.pod_id
          Remove_key      kubernetes.docker_id
          Remove_key      _id
          Remove_key      _p
          Remove_key      _score
    ## https://docs.fluentbit.io/manual/pipeline/outputs
    outputs: |
      [OUTPUT]
          Name opensearch
          Match kube.*
          Host oam-opensearch.default.svc.cluster.local
          Port 9200
          Trace_Error Off
          Trace_Output Off
          Logstash_Format On
          Logstash_Prefix oam
          Logstash_DateFormat %Y%m%d
          Suppress_Type_Name On
          Compress gzip

aws-ebs-csi-driver:
  useOldCSIDriver: true
  enabled: true
  controller:
    createPDB: true  # Set to false to disable the PDB

opensearch:
  enabled: true
  extraConfig:
    compatibility.override_main_response_version: true
  global:
    imageRegistry: harbor.mosaic.siemens-energy.cloud/docker-cache
  image:
    pullPolicy: IfNotPresent
    repository: bitnamilegacy/opensearch
  useIstioLabels: false
  volumePermissions:
    enabled: true
  master:
    masterOnly: false
    replicaCount: 1
    resourcesPreset: large
    heapSize: "3000m" ## it should be 1/2 of requests memory
    persistence:
      storageClass: "ebs-sc"
      size: 100Gi
      existingClaim: "opensearch-claim"
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 1
        ephemeral-storage: 50Mi
        memory: "3Gi" ## when changing this value, heapsize should be updated also
      limits:
        cpu: 1500m
        ephemeral-storage: 1Gi
        memory: 4Gi
    pdb:
      create: false
      minAvailable: 0
      maxUnavailable: 0
  data:
    replicaCount: 0
    pdb:
      create: false
      minAvailable: 0
      maxUnavailable: 0
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
    pdb:
      create: false
      minAvailable: 0
      maxUnavailable: 0
  dashboards:
    enabled: true
    pdb:
      create: false
      minAvailable: 0
      maxUnavailable: 0
    service:
      type: NodePort
    image:
      registry: harbor.mosaic.siemens-energy.cloud/docker-cache
      repository: bitnamilegacy/opensearch-dashboards
    initContainers:
      - name: volume-permissions
        image: harbor.mosaic.siemens-energy.cloud/docker-cache/bitnami/os-shell:12-debian-12-r18
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
          - -ec
          - |
            mkdir -p /bitnami/opensearch-dashboards
            chown 1001:1001 /bitnami/opensearch-dashboards
            find /bitnami/opensearch-dashboards -mindepth 1 -maxdepth 1 -not -name ".snapshot" -not -name "lost+found" | xargs -r chown -R 1001:1001
        securityContext:
          runAsUser: 0
        resources:
          limits:
            cpu: 150m
            ephemeral-storage: 1Gi
            memory: 192Mi
          requests:
            cpu: 100m
            ephemeral-storage: 50Mi
            memory: 128Mi
        volumeMounts:
          - name: empty-dir
            mountPath: /tmp
            subPath: tmp-dir
          - name: dashboards-data
            mountPath: /bitnami/opensearch-dashboards
    persistence:
      enabled: true
      storageClass: "ebs-sc"
      size: 10Gi
      existingClaim: "opensearch-dashboards-claim"
      accessModes:
        - ReadWriteOnce
    extraVolumeMounts:
      - name: dashboards-config
        mountPath: /opt/bitnami/opensearch-dashboards/config.default
    extraVolumes:
      - name: dashboards-config
        configMap:
          name: opensearch-dasboards-conf
    updateStrategy:
      type: Recreate
    customLivenessProbe:
