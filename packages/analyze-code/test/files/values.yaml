assetDataManagement:
  enabled: true
  deploymentName: oam-asset-data-management
  replicaCount: 1
  port: 8080
  image:
    repository: omn-prd-fra-adm-ecr-repo
    pullPolicy: IfNotPresent
  #    tag: "Specified in qa/dev/prod.yaml"
  env:
    SERVER_PORT: "8080"
    DB_NAME: "oam_adm"
    MM_PROTOCOL: "http://"
    FS_URL: "files-manager"
    SERVICE_NAME: "asset-data-management"
    TRACING_ENABLED: "true"
    RABBIT_TRACING_ENABLED: "true"
    REST_TEMPLATE_HEADER_CUSTOMIZER_ENABLED: "true"
    FEIGN_CLIENT_HEADER_CUSTOMIZER_ENABLED: "true"
  service:
    name: asset-data-management
    type: NodePort
    port: 80
    targetport: 8080
  resources:
    requests:
      memory: "2Gi"  # Minimum memory the pod will request from the node, ensuring the pod has at least 2Gi of RAM to operate efficiently even under normal load.
      cpu: "500m"    # Minimum CPU the pod will request from the node. This reserves 0.5 cores of CPU to handle steady workloads and avoid being throttled.
    limits:
      memory: "8Gi"  # Maximum memory the pod can use. The container will not exceed 8Gi of RAM, preventing it from consuming too many resources and causing instability in the cluster.
      cpu: "2000m"   # Maximum CPU the pod can use, allowing it to scale up to 2 full CPU cores during peak usage but not beyond, ensuring that it doesn’t monopolize CPU resources.
  probes:
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: http
      initialDelaySeconds: 80
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 20
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: http
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 15
      successThreshold: 1
      failureThreshold: 21
  autoscaling:
    enabled: false
    # maxreplica: 1     # maximum replica to scale up
#    targetMemory: 70  # average % memory usage, calculated from resources.requests, should be removed if memory scale not required, this is default
#    targetCPU: 70     # average % cpu usage, calculated from resources.requests, should be removed if cpu scale not required

