auth:
  enabled: true
  reset: false
  resetjob:
    claimname: "keycloak-reset"
    claimsize: "5Gi"
    mount: "/tmp/keycloak"
  deploymentName: oam-keycloak
  replicaCount: 1
  port: 8080
  image:
    repository: harbor.mosaic.siemens-energy.cloud/docker-cache/keycloak/keycloak
    pullPolicy: IfNotPresent
    tag: "26.0.7"
  env:
    KC_DB: "postgres"
  service:
    name: auth
    type: NodePort
    port: 80
    targetport: 8080
  resources:
    requests:
      memory: "500Mi"
      cpu: "50m"
    limits:
      memory: "5000Mi"
      cpu: "600m"
