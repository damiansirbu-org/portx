# Main values file
image:
  registry: "harbor.mosaic.siemens-energy.cloud/oam"
  docker: "harbor.mosaic.siemens-energy.cloud/docker-cache/"

tags:
  aws: true

ingress:
  enabled: true

serviceRegistry:
  enabled: true
  deploymentName: oam-service-registry
  replicaCount: 1
  port: 8080
  image:
    repository: omn-prd-fra-service-registry-ecr-repo
    pullPolicy: IfNotPresent
  #    tag: "Specified in qa/dev/prod.yaml"
  env:
    SERVER_PORT: "8080"
    SERVICE_NAME: "service-registry"
    TRACING_ENABLED: "true"
  service:
    name: service-registry
    type: NodePort
    port: 80
    targetport: 8080
  resources:
    requests:
      memory: "300Mi"
      cpu: "50m"
    limits:
      memory: "600Mi"
      cpu: "100m"
  autoscaling:
    enabled: false
#    maxreplica: 1     # maximum replica to scale up
#    targetMemory: 70  # average % memory usage, calculated from resources.requests, should be removed if memory scale not required, this is default
#    targetCPU: 70     # average % cpu usage, calculated from resources.requests, should be removed if cpu scale not required

