    name: gateway
    type: NodePort
    port: 80
    targetport: 8080
  resources:
    requests:
      memory: "500Mi"
      cpu: "100m"
    limits:
      memory: "1000Mi"
      cpu: "500m"
#  probes:
#    livenessProbe:
#      httpGet:
#        path: /actuator/health/liveness
#        port: http
#      initialDelaySeconds: 80
#      periodSeconds: 15
#      timeoutSeconds: 15
#      failureThreshold: 10
#    readinessProbe:
#      httpGet:
#        path: /actuator/health/readiness
#        port: http
#      initialDelaySeconds: 90
#      periodSeconds: 15
#      timeoutSeconds: 15
#      successThreshold: 1
#      failureThreshold: 10
  autoscaling:
    enabled: false
#    maxreplica: 1     # maximum replica to scale up
#    targetMemory: 70  # average % memory usage, calculated from resources.requests, should be removed if memory scale not required, this is default
#    targetCPU: 70     # average % cpu usage, calculated from resources.requests, should be removed if cpu scale not required

userManagement:
  enabled: true
  deploymentName: oam-user-management
  replicaCount: 1
  port: 8080
  image:
    repository: omn-prd-fra-oam-user-mgt-ecr-repo
    pullPolicy: IfNotPresent
  #    tag: "Specified in qa/dev/prod.yaml"
  env:
    SERVER_PORT: "8080"
    DB_NAME: "oam_user_management"
    INITIALIZE_DEFAULT_USERS: "true"
    ASYNC_DISABLE_EXPIRED_USERS_TASK_CRON: "0 1 0 * * *"
    MAXIMUM_POOL_SIZE: "10"
    SERVICE_NAME: "user-management"
    TRACING_ENABLED: "true"
    RABBIT_TRACING_ENABLED: "true"
    REST_TEMPLATE_HEADER_CUSTOMIZER_ENABLED: "true"
    FEIGN_CLIENT_HEADER_CUSTOMIZER_ENABLED: "true"
  service:
    name: user-management
    type: NodePort
    port: 80
    targetport: 8080
  resources:
    requests:
      memory: "600Mi"
      cpu: "250m"
    limits:
      memory: "1200Mi"
      cpu: "1000m"
  probes:
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: http
      initialDelaySeconds: 80
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 30
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: http
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 15
      successThreshold: 1
      failureThreshold: 31
  autoscaling:
    enabled: true

