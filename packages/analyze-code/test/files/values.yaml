metricbeat:
  enabled: true
  imageTag: 7.10.2
  image: docker.elastic.co/beats/metricbeat-oss
  fullnameOverride: "metricbeat"
  secretMounts: []
  extraEnvs: []
  deployment:
    enabled: true
    extraEnvs: []
    secretMounts: []
    metricbeatConfig:
      metricbeat.yml: |
        metricbeat.modules:  
        - module: rabbitmq
          metricsets: ["queue"]
          enabled: true
          period: 55s
          hosts: ["rabbit:15672"]
          username: "defaultusr" 
          password: "21312sda123"
        - module: kubernetes  
          enabled: true  
          period: 55s
          metricsets:  
            - state_container  
          hosts: ["oam-kube-state-metrics:8080"]  
          add_metadata: true  
        output.elasticsearch:  
          hosts: ["http://oam-opensearch.default.svc.cluster.local:9200"]  
          ssl.enabled: false
  daemonset:
    extraEnvs: []
    secretMounts: []
    metricbeatConfig:
      metricbeat.yml: |
        processors:  
        - drop_fields:  
            fields: ["agent.name", "agent.type", "agent.version", "agent.ephemeral_id", "agent.hostname", "agent.id", "ecs.version", "host.name"]  
            ignore_missing: true  
        metricbeat.modules:  
        - module: kubernetes  
          enabled: true  
          metricsets:  
            - container  
            - node  
            - pod  
            - volume  
          period: 55s  
          host: "${NODE_NAME}"  
          hosts: ["https://${NODE_NAME}:10250"]  
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token  
          ssl.verification_mode: "none"  
          add_metadata: true  
          processors:  
            - add_kubernetes_metadata: ~  
        - module: system  
          enabled: true  
          metricsets:  
            - cpu             # CPU usage  
            - load            # CPU load averages  
            - memory          # Memory usage  
            - network         # Network IO  
          period: 60s  
          processes: ['.*']  
          processors:  
            - add_fields:  
                target: agent  
                fields:  
                  vmhostname: "${NODE_NAME}"  
        output.elasticsearch:  
          hosts: ["http://oam-opensearch.default.svc.cluster.local:9200"]  
          ssl.enabled: false

