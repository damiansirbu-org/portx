rabbit:
  enabled: true
  replicaCount: 1
  fullnameOverride: "rabbit"
  volumePermissions:
    enabled: true
  automountServiceAccountToken: true
  extraPlugins: "rabbitmq_federation"
  disksize: "15Gi"
  global:
    imageRegistry: "harbor.mosaic.siemens-energy.cloud/docker-cache"
  image:
    repository: bitnamilegacy/rabbitmq  
    pullPolicy: IfNotPresent
  persistence:
    existingClaim: "rabbit-pv-claim"
  service:
    ports:
      amqp: 5672
  resources:
    requests:
      memory: "500Mi"
      cpu: "250m"
    limits:
      memory: "5000Mi"
      cpu: "1000m"

assetDiagnostics:
  enabled: true
  deploymentName: oam-asset-diagnostics
  replicaCount: 1
  port: 8080
  image:
    repository: omn-prd-fra-asset-diagnostics-backend-ecr-repo
    pullPolicy: IfNotPresent
  #    tag: "Specified in qa/dev/prod.yaml"
  env:
    SERVER_PORT: "8080"
    DB_NAME: "oam_asset_diagnostics"
    ADM_URL: "http://asset-data-management/api/v1/assets/"
    ADM_PATH_TREE: "getAllAssets"
    ADM_PATH_PARENT_ASSET: "getAssetsByParentId"
    ADM_PATH_ASSETS: "getAssetsByAssetIds"
    CE_URL: "http://calculation-engine"
    CE_TASK_CREATE_PATH: "/calculation-engine/v1/api/tasks"
    CE_TASK_DISABLE_PATH: "/calculation-engine/v1/api/tasks/disable"
    LOGGING_LEVEL: "INFO"
    SERVICE_NAME: "asset-diagnostics"
    TRACING_ENABLED: "true"
    TIME_WINDOWS_GRACE: 10
  service:
    name: asset-diagnostics
    type: NodePort
    port: 80
    targetport: 8080
  resources:
    requests:
      memory: "1000Mi"
      cpu: "500m"
    limits:
      memory: "1300Mi"
      cpu: "1000m"
  probes:
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: http
      initialDelaySeconds: 100
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 20
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: http
      initialDelaySeconds: 110
      periodSeconds: 15
      timeoutSeconds: 15
      successThreshold: 1
      failureThreshold: 21
  autoscaling:
    enabled: true
  #   maxreplica: 1     # maximum replica to scale up
#    targetMemory: 70  # average % memory usage, calculated from resources.requests, should be removed if memory scale not required, this is default
#    targetCPU: 70     # average % cpu usage, calculated from resources.requests, should be removed if cpu scale not required

reliabilityManagement:
  enabled: true
  deploymentName: oam-reliability-management
  replicaCount: 1
  port: 8080
  image:
    repository: omn-prd-fra-oam-reliability-mgt-ecr-repo
    pullPolicy: IfNotPresent
  #    tag: "Specified in qa/dev/prod.yaml"
  env:
    SERVER_PORT: "8080"
    LIQUIBASE_CONTEXTS: "prd"
    ATL_URL: "https://atl-api.mosaic-dev.siemens-energy.cloud"
    MAX_FILES_SIZE: "100MB"
    MAX_FILES_REQUEST_SIZE: "500MB"
    SERVICE_NAME: "reliability-management"
    TRACING_ENABLED: "true"
    RABBIT_TRACING_ENABLED: "true"
    REST_TEMPLATE_HEADER_CUSTOMIZER_ENABLED: "true"
    FEIGN_CLIENT_HEADER_CUSTOMIZER_ENABLED: "true"
    CODE_EXPRESSION_PROTECTION_ENABLED: "false"
  service:
    name: reliability-management
    type: NodePort
    port: 80
    targetport: 8080
  resources:
    requests:
      memory: "1700Mi"
      cpu: "250m"
    limits:
      memory: "3400Mi"
      cpu: "1500m"
  probes:
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: http
      initialDelaySeconds: 80
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 20
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: http
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 15
      successThreshold: 1
      failureThreshold: 21
  autoscaling:
    enabled: true
