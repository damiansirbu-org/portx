    name: data-loader
    type: NodePort
    port: 80
    targetport: 8080
  resources:
    requests:
      memory: "2Gi"  # Minimum memory the pod will request from the node, ensuring the pod has at least 2Gi of RAM to operate efficiently even under normal load.
      cpu: "500m"    # Minimum CPU the pod will request from the node. This reserves 0.5 cores of CPU to handle steady workloads and avoid being throttled.
    limits:
      memory: "8Gi"  # Maximum memory the pod can use. The container will not exceed 8Gi of RAM, preventing it from consuming too many resources and causing instability in the cluster.
      cpu: "2000m"   # Maximum CPU the pod can use, allowing it to scale up to 2 full CPU cores during peak usage but not beyond, ensuring that it doesn’t monopolize CPU resources.
  probes:
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: http
      initialDelaySeconds: 80
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 10
    readinessProbe:
      httpGet:
