apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: testing
  labels:
    app: test-app
    version: "1.0.0"
    environment: staging
  annotations:
    deployment.kubernetes.io/revision: "1"
    analyzer.test/purpose: "comprehensive-validation"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
        version: "1.0.0"
    spec:
      serviceAccountName: test-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: main-app
        image: test-app:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: redis_url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: app-data
          mountPath: /data
        - name: config-volume
          mountPath: /etc/config
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: app-data-pvc
      - name: config-volume
        configMap:
          name: app-config
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "app-nodes"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - test-app
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: test-app-service
  namespace: testing
  labels:
    app: test-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: test-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: testing
  labels:
    app: test-app
data:
  redis_url: "redis://redis-service:6379"
  log_level: "info"
  debug_mode: "false"
  feature_flags: |
    {
      "new_ui": true,
      "analytics": false,
      "experimental_features": true
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: testing
  labels:
    app: test-app
type: Opaque
data:
  url: cG9zdGdyZXNxbDovL3VzZXI6cGFzcUBkYi5leGFtcGxlLmNvbTo1NDMyL2FwcGRi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-service-account
  namespace: testing
  labels:
    app: test-app
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: testing
  name: test-app-role
  labels:
    app: test-app
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-app-rolebinding
  namespace: testing
  labels:
    app: test-app
subjects:
- kind: ServiceAccount
  name: test-service-account
  namespace: testing
roleRef:
  kind: Role
  name: test-app-role
  apiGroup: rbac.authorization.k8s.io