# Main configuration file for test analyzer validation
# Cross-references: TestService.java, json_helper.py, UserService.cs, tests.js, execute_tests.sh

# Database configuration
database:
  url: "postgresql://localhost:5432/testdb"
  timeout: 30
  poolSize: 10
  maxConnections: 50
  ssl:
    enabled: true
    mode: "require"
    cert: "/path/to/cert.pem"
    key: "/path/to/key.pem"
  backup:
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention: 7  # days

# API configuration
api:
  timeout: 60
  retries: 3
  rateLimit: 100
  endpoints:
    users: "/api/v1/users"
    health: "/health"
    metrics: "/metrics"
  authentication:
    type: "jwt"
    secret: "${JWT_SECRET}"
    expiration: 3600  # seconds
  cors:
    enabled: true
    origins:
      - "http://localhost:3000"
      - "https://app.example.com"
    methods: ["GET", "POST", "PUT", "DELETE"]
    headers: ["Content-Type", "Authorization"]

# Feature flags and toggles
features:
  - logging
  - monitoring
  - admin_filter
  - age_filter
  - caching
  - analytics
  - security_scanning

# Logging configuration
logging:
  level: "info"
  format: "json"
  outputs:
    - type: "console"
      enabled: true
    - type: "file"
      enabled: true
      path: "/var/log/app.log"
      maxSize: "100MB"
      maxFiles: 5
    - type: "elasticsearch"
      enabled: false
      url: "http://localhost:9200"
      index: "app-logs"

# Monitoring and metrics
monitoring:
  enabled: true
  interval: 30  # seconds
  metrics:
    - cpu
    - memory
    - disk
    - network
    - custom
  alerting:
    enabled: true
    channels:
      - type: "email"
        recipients: ["admin@example.com"]
      - type: "slack"
        webhook: "${SLACK_WEBHOOK}"
    thresholds:
      cpu: 80  # percent
      memory: 85  # percent
      disk: 90  # percent

# Security configuration
security:
  encryption:
    algorithm: "AES-256-GCM"
    keyRotation: 24  # hours
  authentication:
    methods: ["password", "oauth", "saml"]
    passwordPolicy:
      minLength: 8
      requireSpecialChar: true
      requireNumber: true
      requireUppercase: true
  authorization:
    rbac:
      enabled: true
      roles:
        - name: "admin"
          permissions: ["*"]
        - name: "user"
          permissions: ["read", "write:own"]
        - name: "viewer"
          permissions: ["read"]

# Testing configuration
testing:
  parallel: true
  maxWorkers: 4
  timeout: 300  # seconds
  environments:
    development:
      debug: true
      logLevel: "debug"
      database:
        url: "postgresql://localhost:5432/testdb_dev"
    staging:
      debug: false
      logLevel: "info"
      database:
        url: "postgresql://staging:5432/testdb_staging"
    production:
      debug: false
      logLevel: "warn"
      database:
        url: "${DATABASE_URL}"

# External services
services:
  redis:
    enabled: true
    url: "redis://localhost:6379"
    database: 0
    timeout: 5000  # milliseconds
    pool:
      min: 5
      max: 20
  elasticsearch:
    enabled: false
    url: "http://localhost:9200"
    timeout: 10000  # milliseconds
    indices:
      logs: "app-logs"
      metrics: "app-metrics"
  messageQueue:
    enabled: true
    type: "rabbitmq"
    url: "amqp://localhost:5672"
    exchanges:
      - name: "events"
        type: "topic"
      - name: "tasks"
        type: "direct"

# Deployment configuration
deployment:
  strategy: "rolling"
  replicas: 3
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  health:
    readiness:
      path: "/health/ready"
      interval: 10
      timeout: 5
      threshold: 3
    liveness:
      path: "/health/live"
      interval: 30
      timeout: 10
      threshold: 3

# Integration settings
integrations:
  java:
    enabled: true
    classPath: "/app/lib"
    mainClass: "com.example.service.TestService"
    jvmOptions:
      - "-Xmx512m"
      - "-XX:+UseG1GC"
  python:
    enabled: true
    version: "3.9"
    virtualenv: "/app/venv"
    requirements: "/app/requirements.txt"
  javascript:
    enabled: true
    nodeVersion: "16"
    packageManager: "npm"
    buildCommand: "npm run build"
  dotnet:
    enabled: true
    framework: "net6.0"
    buildConfiguration: "Release"
    outputPath: "/app/bin"

# Cross-reference validation
crossReferences:
  files:
    - name: "TestService.java"
      type: "java"
      dependencies: ["DatabaseConnection", "User", "JsonHelper"]
    - name: "json_helper.py"
      type: "python"
      dependencies: ["config.yaml", "scripts"]
    - name: "tests.js"
      type: "javascript"
      dependencies: ["config.yaml", "package.json"]
    - name: "UserService.cs"
      type: "csharp"
      dependencies: ["DatabaseConnection", "User"]
    - name: "execute_tests.sh"
      type: "bash"
      dependencies: ["all test files", "config.yaml"]

# Environment-specific overrides
environments:
  local:
    database:
      url: "postgresql://localhost:5432/testdb_local"
    logging:
      level: "debug"
    features:
      - logging
      - monitoring
  docker:
    database:
      url: "postgresql://db:5432/testdb"
    services:
      redis:
        url: "redis://redis:6379"
  kubernetes:
    database:
      url: "${DATABASE_URL}"
    services:
      redis:
        url: "${REDIS_URL}"
    monitoring:
      enabled: true
      prometheus:
        enabled: true
        port: 9090