apiVersion: v2
name: oam
description: OAM Helm Chart

type: application

version: 0.1.11
appVersion: "0.0.0.0" # Not to be used, appversion is updated from environment values files !!!

dependencies:
  - name: aws-ebs-csi-driver
    repository: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    version: ~2.23.1
    condition: aws-ebs-csi-driver.enabled
    tags:
      - aws
  - name: metrics-server
    repository: https://kubernetes-sigs.github.io/metrics-server/
    version: "^3.8.2"
    condition: metrics-server.enabled
    tags:
      - aws
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: reliabilityManagementDB
    version: 11.9.13
    condition: reliabilityManagementDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: authDB
    version: 11.9.13
    condition: authDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: admDB
    version: 11.9.13
    condition: admDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: assetDiagnosticsDB
    version: 11.9.13
    condition: assetDiagnosticsDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: checklistManagerDB
    version: 11.9.13
    condition: checklistManagerDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: calculationEngineDB
    version: 11.9.13
    condition: calculationEngineDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: llmServiceDB
    version: 11.9.13
    condition: llmServiceDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: dataManagerDB
    version: 11.9.13
    condition: dataManagerDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: filesManagerDB
    version: 11.9.13
    condition: filesManagerDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: maintenanceManagementDB
    version: 11.9.13
    condition: maintenanceManagementDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: userManagementDB
    version: 11.9.13
    condition: userManagementDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: inventoryManagementDB
    version: 11.9.13
    condition: inventoryManagementDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: schedulingServiceDB
    version: 11.9.13
    condition: schedulingServiceDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: masterAtlDB
    version: 11.9.13
    condition: masterAtlDB.enabled
    tags:
      - postgres
  - name: traefik # https://github.com/traefik/traefik-helm-chart/blob/master/traefik
    repository: https://helm.traefik.io/traefik
    alias: traefikController
    version: 21.2.0
    condition: traefikController.enabled
  - name: memcached # https://artifacthub.io/packages/helm/bitnami/memcached
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: memCache
    version: 7.0.3
    condition: memCache.enabled
  - name: fluent-bit # https://github.com/fluent/helm-charts/blob/main/charts/fluent-bit
    repository: https://fluent.github.io/helm-charts
    alias: fluentbit
    version: 0.44.0
    condition: fluentbit.enabled
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: operationsDashboardDb
    version: 11.9.13
    condition: operationsDashboardDb.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: operationManagementDb
    version: 11.9.13
    condition: operationManagementDb.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: telerikServiceDB
    version: 11.9.13
    condition: telerikServiceDB.enabled
    tags:
      - postgres
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: dataLoaderDB
    version: 11.9.13
    condition: dataLoaderDB.enabled
    tags:
      - postgres
  - name: opensearch # https://artifacthub.io/packages/helm/bitnami/opensearch
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: opensearch
    version: 1.3.7
    condition: opensearch.enabled
  - name: metricbeat # https://artifacthub.io/packages/helm/elastic/metricbeat
    repository: https://helm.elastic.co
    alias: metricbeat
    version: 8.5.1
    condition: metricbeat.enabled
  - name: rabbitmq # https://artifacthub.io/packages/helm/bitnami/rabbitmq/12.15.0
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: rabbit
    version: 12.15.0
    condition: rabbit.enabled
    tags:
      - rabbitmq
  - name: jaeger # https://artifacthub.io/packages/helm/jaegertracing/jaeger
    repository: https://jaegertracing.github.io/helm-charts
    alias: jaeger
    version: 3.3.2
    condition: jaeger.enabled
    tags:
      - jaeger
  - name: kafka # https://artifacthub.io/packages/helm/bitnami/kafka
    repository: https://charts.bitnami.com/bitnami
    alias: kafka_kraft
    version: 32.3.14
    condition: kafka_kraft.enabled
  - name: postgresql # https://artifacthub.io/packages/helm/bitnami/postgresql/11.0.8
    repository: "oci://registry-1.docker.io/bitnamicharts"
    alias: mailServiceDB
    version: 11.9.13
    condition: mailServiceDB.enabled
    tags:
      - postgres
  - name: clamav # https://artifacthub.io/packages/helm/wiremind/clamav
    repository: "https://wiremind.github.io/wiremind-helm-charts"
    alias: clamav
    version: 3.7.1
    condition: clamav.enabled

